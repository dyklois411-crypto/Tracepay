<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TracePay</title><style>:root{--bg:#07111f;--p:#0d1a2b;--p2:#102238;--l:#1d3550;--t:#eef6ff;--m:#91a6bc;--a:#8b7cff;--g:#38d39f;--r:#ff6b81;--y:#ffcc66}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101d,#0a1727);color:var(--t);font:14px system-ui}.app{display:flex;min-height:100vh}.side{width:230px;padding:20px 14px;border-right:1px solid var(--l);background:#081423}.brand{font-size:21px;font-weight:800;padding:8px 12px 22px}.brand span{color:var(--a)}nav button{width:100%;border:0;background:none;color:var(--m);padding:11px;border-radius:9px;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:var(--p2);color:#fff}.main{flex:1;padding:24px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.top h1{margin:0 0 4px}.muted{color:var(--m)}.pill,.status{border-radius:999px;padding:5px 9px;font-size:11px}.pill{border:1px solid var(--l);color:var(--m);height:max-content}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,26,43,.95);border:1px solid var(--l);border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:800}.section{margin-top:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--l)}.table th{color:var(--m);font-size:12px}.ok{background:#10372d;color:var(--g)}.bad{background:#3b1721;color:var(--r)}.warn{background:#3a2d12;color:var(--y)}.btn{border:1px solid var(--l);background:var(--p2);color:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.primary{background:var(--a);border-color:var(--a)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.timeline{display:grid;gap:8px}.event{border-left:3px solid var(--a);background:#0a1727;padding:9px 12px}.code{white-space:pre-wrap;background:#06101d;border:1px solid var(--l);padding:14px;border-radius:10px;overflow:auto}.notice{padding:12px;border:1px solid #5b4b1b;background:#241d0c;border-radius:10px;color:#ffe4a1}@media(max-width:800px){.side{width:70px}.brand{font-size:0;text-align:center}.brand span{font-size:20px}.side nav button{font-size:0;text-align:center}.side nav button:after{content:'•';font-size:20px}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:14px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{display:block}}</style></head><body><div class="app"><aside class="side"><div class="brand">Trace<span>Pay</span></div><nav id="nav"><button class="active" data-p="dashboard">Dashboard</button><button data-p="transactions">Transactions</button><button data-p="investigations">Investigations</button><button data-p="reports">Evidence Reports</button><button data-p="api">API</button><button data-p="docs">Docs</button></nav></aside><main class="main"><header class="top"><div><h1 id="title">Transaction Evidence</h1><div class="muted">Reconstruct what happened to every payment.</div></div><span class="pill">DEMO • SYNTHETIC DATA</span></header><div id="page"></div></main></div><script>
const tx=[['TX-1001','Provider A',12500,'SETTLED','PA-7712',['INITIATED','AUTHORIZED','DEBITED','CREDITED','SETTLED']],['TX-1002','Provider B',8300,'EXCEPTION','PB-9914',['INITIATED','AUTHORIZED','DEBITED']],['TX-1003','Provider C',25000,'SETTLED','PC-4410',['INITIATED','AUTHORIZED','DEBITED','CREDITED','SETTLED']],['TX-1004','Provider A',5400,'EXCEPTION','PA-7719',['INITIATED','DEBITED','CREDITED','DEBITED']],['TX-1005','Provider C',19900,'FAILED','PC-4421',['INITIATED','FAILED']]];const money=n=>'₦'+n.toLocaleString();function table(){return `<div class="tablewrap"><table class="table"><tr><th>Transaction</th><th>Provider</th><th>Amount</th><th>Status</th><th>Reference</th></tr>${tx.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${money(x[2])} NGN</td><td><span class="status ${x[3]=='SETTLED'?'ok':x[3]=='FAILED'?'bad':'warn'}">${x[3]}</span></td><td>${x[4]}</td></tr>`).join('')}</table></div>`}function dash(){return `<div class="grid"><div class="card"><div class="muted">Transactions</div><div class="metric">5</div></div><div class="card"><div class="muted">Exceptions</div><div class="metric">2</div></div><div class="card"><div class="muted">Settled</div><div class="metric">2</div></div><div class="card"><div class="muted">Tracked</div><div class="metric">₦71,100</div></div></div><div class="card section"><h2>Recent evidence</h2>${table()}</div><div class="card section"><h2>Pipeline</h2><p class="muted">Ingest → Normalize → Order → Validate → Detect exception → Report</p></div>`}function transactions(){return `<div class="card"><div class="toolbar"><button class="btn primary" onclick="alert('Synthetic demo ingestion only')">+ Ingest demo event</button><button class="btn" onclick="exportData()">Export JSON</button></div>${table()}</div>`}function investigations(){return `<div class="card"><h2>Open exceptions</h2><div class="section card"><b>EX-201 · Debit without credit</b><span class="status bad" style="float:right">HIGH</span><p class="muted">TX-1002: Provider B reports a debit but no matching credit.</p><button class="btn" onclick="inspect(1)">Inspect timeline</button></div><div class="section card"><b>EX-202 · Duplicate event</b><span class="status warn" style="float:right">MEDIUM</span><p class="muted">TX-1004: DEBITED appears twice in the reconstructed timeline.</p><button class="btn" onclick="inspect(3)">Inspect timeline</button></div><div id="inspection" class="section"></div></div>`}function inspect(i){let x=tx[i];document.getElementById('inspection').innerHTML=`<div class="card"><h2>${x[0]} timeline</h2><div class="timeline">${x[5].map((e,j)=>`<div class="event"><b>${e}</b><br><small class="muted">sequence ${j+1} · ${x[1]} · ${x[4]}</small></div>`).join('')}</div></div>`}function reports(){return `<div class="notice">Synthetic data only. Production reports require authorized data, security controls and appropriate legal/privacy review.</div><div class="card"><h2>Evidence report preview</h2><p><b>Transaction:</b> TX-1002</p><p><b>Finding:</b> Debit without matching credit.</p><p><b>Amount:</b> ₦8,300 NGN</p><p><b>Timeline:</b> INITIATED → AUTHORIZED → DEBITED</p><p><b>Action:</b> Provider-side investigation required before treating the transaction as fully settled.</p><button class="btn primary" onclick="print()">Print / Save report</button></div>`}function api(){return `<div class="card"><h2>API contract</h2><div class="code">POST /v1/events
Content-Type: application/json

{"transaction_id":"TX-1002","timestamp":"2026-09-19T18:08:00Z","provider":"provider_b","amount":8300,"currency":"NGN","event_type":"DEBITED","event_status":"SUCCESS","reference":"PB-9914","source":"provider_webhook"}

Response: {"accepted":true,"normalized_event_id":"evt_demo_001"}</div></div>`}function docs(){return `<div class="card"><h2>TracePay V1</h2><p>Transaction Evidence & Reconciliation Infrastructure.</p><p class="muted">TracePay normalizes heterogeneous payment events, reconstructs transaction timelines, detects exceptions and creates investigation-ready evidence.</p><h3>Events</h3><p class="muted">INITIATED · AUTHORIZED · DEBITED · CREDITED · SETTLED · FAILED · REVERSED · TIMEOUT</p><h3>Exceptions</h3><p class="muted">Debit without credit · credit without debit · duplicate event · missing event · timeout · conflicting status · amount mismatch · currency mismatch · impossible sequence.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(tx,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tracepay-demo-transactions.json';a.click()}const pages={dashboard:dash,transactions,investigations,reports,api,docs};function render(p){document.getElementById('title').textContent=p==='dashboard'?'Transaction Evidence':p[0].toUpperCase()+p.slice(1);document.getElementById('page').innerHTML=pages[p]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}document.getElementById('nav').onclick=e=>e.target.dataset.p&&render(e.target.dataset.p);render('dashboard');</script></body></html>
